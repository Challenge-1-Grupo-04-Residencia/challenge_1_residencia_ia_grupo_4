[project]
name = "challenge-1-residencia-ia-grupo-4"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "mkdocs-material>=9.7.7",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.4",
    "pytest>=8.0.0",
    "joblib>=1.4.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.29",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.5",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "sentence-transformers>=2.7.0",
    "cloudscraper>=1.2.71",
]

# A camada N4 nao carrega modelo nenhum no processo: ela chama um LLM servido pelo
# Ollama por HTTP (ver `backend/src/core/engine/n4_nli.py`). Nao ha dependencia Python
# para isso alem da biblioteca padrao -- quem for mexer na N4 precisa do servico de pe:
#     docker compose up -d ollama && docker exec -it vera_ollama ollama pull llama3
#
# O extra opcional `nli`, com transformers e torch (~2 GB), foi removido: ele existia
# para um desenho anterior baseado em mDeBERTa que nao esta no codigo. Nada importava
# `transformers`, e o download pesava no `uv sync` de todo mundo sem servir a ninguem.

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[project]
name = "challenge-1-residencia-ia-grupo-4"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "mkdocs-material>=9.7.7",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.4",
    "pytest>=8.0.0",
    "joblib>=1.4.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.29",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.5",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "sentence-transformers>=2.7.0",
]

# A camada N4 carrega um modelo de NLI (mDeBERTa), que traz o torch: cerca de 2 GB.
# Fica em extra opcional para nao pesar no `uv sync` de quem so trabalha nos notebooks
# ou nas camadas N0 a N3.
#     uv sync --extra nli
[project.optional-dependencies]
nli = [
    "transformers>=4.44.0",
    "torch>=2.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Senhora Vera - Checagem de Fatos</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f7f8f5;
        color: #202820;
      }

      body {
        box-sizing: border-box;
        margin: 0;
        padding: 18px;
        width: 350px;
      }

      header {
        margin-bottom: 12px;
      }

      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
        color: #194b32;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .domain {
        overflow: hidden;
        margin: 4px 0 0;
        color: #59635b;
        font-size: 13px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .reputation {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 42px;
        margin-bottom: 14px;
        padding: 0 12px;
        border: 1px solid #dce2da;
        border-radius: 8px;
        background: #fff;
        font-weight: 650;
      }

      .indicator {
        width: 12px;
        height: 12px;
        flex: 0 0 12px;
        border-radius: 50%;
        background: #89918a;
      }

      .reputation[data-rating="verde"] .indicator { background: #20834a; }
      .reputation[data-rating="amarelo"] .indicator { background: #d39b00; }
      .reputation[data-rating="vermelho"] .indicator { background: #c53b36; }

      .privacy-box {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        background: #eef3ee;
        border: 1px solid #d6e2d6;
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 14px;
      }

      .privacy-icon {
        font-size: 14px;
        line-height: 1.3;
        flex-shrink: 0;
      }

      .privacy-text {
        margin: 0;
        color: #3b4d3b;
        font-size: 11.5px;
        line-height: 1.45;
      }

      button {
        width: 100%;
        min-height: 42px;
        border: 0;
        border-radius: 8px;
        background: #245e40;
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-size: 14px;
        font-weight: 650;
        transition: background 0.2s ease;
      }

      button:hover { background: #194b32; }
      button:disabled { cursor: wait; opacity: 0.65; }

      .message {
        margin: 12px 0 0;
        color: #59635b;
        font-size: 12.5px;
        line-height: 1.45;
        padding: 8px 10px;
        background: #fff;
        border-radius: 6px;
        border: 1px solid #dce2da;
      }

      .message[hidden] { display: none; }

      .result {
        display: none;
        margin-top: 14px;
        padding: 12px;
        border: 1px solid #dce2da;
        border-radius: 8px;
        background: #fff;
        font-size: 13px;
        line-height: 1.5;
        white-space: pre-wrap;
        color: #202820;
      }

      .result.visible { display: block; }
    </style>
  </head>
  <body>
    <header>
      <h1>🌿 Senhora Vera</h1>
      <p class="domain" id="domain">Página atual</p>
    </header>

    <section class="reputation" id="reputation" data-rating="">
      <span class="indicator" aria-hidden="true"></span>
      <span id="rating-label">Não avaliado</span>
    </section>

    <!-- Transparência e LGPD: aviso amigável de privacidade e minimização -->
    <section class="privacy-box" aria-label="Aviso de Privacidade">
      <span class="privacy-icon" aria-hidden="true">🔒</span>
      <p class="privacy-text">
        <strong>Privacidade garantida:</strong> A análise ocorre apenas sob sua solicitação. Enviamos somente o texto da matéria e a URL para checagem. Não coletamos senhas, formulários, cookies ou histórico.
      </p>
    </section>

    <button id="analyze-button" type="button">Verificar esta página</button>
    <p class="message" id="message" role="status" aria-live="polite" hidden></p>
    <div class="result" id="result" role="region" aria-label="Resultado da checagem"></div>

    <script src="popup.js"></script>
  </body>
</html>

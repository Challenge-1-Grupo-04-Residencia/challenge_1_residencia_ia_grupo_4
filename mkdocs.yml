site_name: Senhora Vera
site_description: Documentação do Grupo 4 — Residência em IA, framework Challenge Based Learning
site_author: Grupo 4
repo_url: https://github.com/iancostag/challenge_1_residencia_ia_grupo_4
repo_name: challenge_1_residencia_ia_grupo_4
edit_uri: edit/docs/docs/

theme:
  name: material
  custom_dir: overrides
  language: pt-BR
  logo: assets/vera/logo.svg
  favicon: assets/vera/logo.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Mudar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Mudar para modo claro
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant.progress
    - navigation.path
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

nav:
  - Início: index.md
  - Visão geral: visao-geral.md
  - O Desafio (CBL): desafio.md
  - Produto:
      - Senhora Vera: produto/vera.md
      - Como a Vera funciona: produto/funcionamento.md
      - Classificação e pesos: produto/classificacao.md
  - Requisitos:
      - Engenharia de Requisitos: requisitos/tecnicas_elicitacao.md
      - Funcionais: requisitos/funcionais.md
      - Não funcionais: requisitos/nao-funcionais.md
      - Regras de negócio: requisitos/regras-de-negocio.md
      - Análise comparativa: requisitos/analise-comparativa.md
  - Backlog:
      - Visão geral: backlog/index.md
      - Épicos: backlog/epicos.md
      # - Histórias de usuário: backlog/historias.md
      - MVP: backlog/mvp.md
      # - Planning Poker: backlog/planning-poker.md
      # - DoR e DoD: backlog/dor-dod.md
  - Mapa de riscos: riscos.md
  - Investigação: investigacao.md
  - Hipóteses técnicas: hipoteses.md
  - Metodologia: metodologia.md
  - Relatórios: relatorios.md
  - Referências: referencias.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search:
      lang: pt

extra:
  generator: false
  # Membros exibidos na seção "Nosso Time" da página inicial.
  # foto: caminho dentro de docs/ (ex.: assets/equipe/maykon.png).
  #       Vazio usa a foto do GitHub; sem github também, usa o avatar padrão.
  # github: usuário do GitHub, sem @; vazio não gera link.
  equipe:
    - { nome: "Maykon Soares", papel: "Product Owner · Developer", foto: "", github: "maykonjuso" }
    - { nome: "Ian Costa", papel: "Scrum Master · Developer", foto: "", github: "iancostag" }
    - { nome: "Luísa Brambilla", papel: "Developer", foto: "", github: "LuisaBrambilla" }
    - { nome: "Natália Evelin", papel: "Developer", foto: "", github: "NataliaLily" }
    - { nome: "Rebeca Bontempo", papel: "Developer", foto: "", github: "rebecaboncaputo" }
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/iancostag/challenge_1_residencia_ia_grupo_4

copyright: Grupo 4 — Residência em IA

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Senhora Vera</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f8f5;
        color: #202820;
      }

      body {
        box-sizing: border-box;
        margin: 0;
        padding: 18px;
        width: 340px;
      }

      h1 {
        margin: 0;
        font-size: 18px;
      }

      .domain {
        overflow: hidden;
        margin: 5px 0 18px;
        color: #59635b;
        font-size: 13px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .reputation {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 42px;
        margin-bottom: 14px;
        padding: 0 12px;
        border: 1px solid #dce2da;
        border-radius: 6px;
        background: #fff;
        font-weight: 650;
      }

      .indicator {
        width: 12px;
        height: 12px;
        flex: 0 0 12px;
        border-radius: 50%;
        background: #89918a;
      }

      .reputation[data-rating="verde"] .indicator { background: #20834a; }
      .reputation[data-rating="amarelo"] .indicator { background: #d39b00; }
      .reputation[data-rating="vermelho"] .indicator { background: #c53b36; }

      .note, .result, .message {
        margin: 0 0 14px;
        color: #59635b;
        font-size: 12px;
        line-height: 1.45;
      }

      .result {
        display: none;
        padding-top: 12px;
        border-top: 1px solid #dce2da;
        white-space: pre-wrap;
      }

      .result.visible { display: block; }
      .message[hidden] { display: none; }

      button {
        width: 100%;
        min-height: 40px;
        border: 0;
        border-radius: 6px;
        background: #245e40;
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 650;
      }

      button:hover { background: #194b32; }
      button:disabled { cursor: wait; opacity: 0.65; }
    </style>
  </head>
  <body>
    <h1>Senhora Vera</h1>
    <p class="domain" id="domain">Página atual</p>

    <section class="reputation" id="reputation" data-rating="">
      <span class="indicator" aria-hidden="true"></span>
      <span id="rating-label">Não avaliado</span>
    </section>

    <p class="note">A classificação é baseada no conteúdo analisado, não no histórico do domínio.</p>
    <button id="analyze-button" type="button">Analisar texto completo</button>
    <p class="message" id="message" role="status" aria-live="polite" hidden></p>
    <p class="result" id="result"></p>

    <script src="popup.js"></script>
  </body>
</html>
